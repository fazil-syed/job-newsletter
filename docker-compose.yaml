services:
  app:
    build: .
    ports:
      - "8082:8080"
    depends_on:
      db :
        condition : service_healthy

  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d newsletter"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
