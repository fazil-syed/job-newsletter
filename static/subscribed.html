<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're in!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .icon {
            font-size: 56px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #f8fafc;
        }

        p {
            font-size: 16px;
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        a {
            display: inline-block;
            padding: 12px 24px;
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #334155;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        a:hover {
            background: #334155;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="icon">🎉</div>
        <h1>You're subscribed!</h1>
        <p>Every Monday at 9am, fresh SWE jobs from the last week will land in your inbox. See you then.</p>
        <a href="/">← Back to home</a>
    </div>
</body>

</html>
